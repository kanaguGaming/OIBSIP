<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="100%" height="100%">
  
    <defs>
      <linearGradient id="gradAscentV" x1="0%" y1="100%" x2="60%" y2="0%">
        <stop offset="0%" stop-color="#00F2FE" />
        <stop offset="45%" stop-color="#0284C7" />
        <stop offset="100%" stop-color="#4F46E5" />
      </linearGradient>
      <linearGradient id="gradDescentV" x1="40%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4F46E5" />
        <stop offset="50%" stop-color="#7C3AED" />
        <stop offset="100%" stop-color="#9333EA" />
      </linearGradient>
      <linearGradient id="gradBridgeV" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38BDF8" />
        <stop offset="35%" stop-color="#6366F1" />
        <stop offset="70%" stop-color="#8B5CF6" />
        <stop offset="100%" stop-color="#D946EF" />
      </linearGradient>
      <linearGradient id="gradHighlightV" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
      </linearGradient>
      <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#4F46E5" flood-opacity="0.32" />
      </filter>
    </defs>
    
  
  <!-- Centered Symbol: x=300..900, y=140..740 (scale 0.6) -->
  <g transform="translate(300, 120) scale(0.6)" filter="url(#vGlow)">
    
      <path d="M 500 155 L 435 155 L 205 725 L 325 725 L 475 355 L 500 240 Z" fill="url(#gradAscentV)" />
      <path d="M 500 155 L 565 155 L 795 725 L 675 725 L 525 355 L 500 240 Z" fill="url(#gradDescentV)" />
      <path d="M 290 535 L 710 535 L 645 635 L 355 635 Z" fill="url(#gradBridgeV)" />
      <polygon points="500,240 540,340 500,440 460,340" fill="url(#gradHighlightV)" opacity="0.85" />
      <polygon points="500,155 475,355 500,240" fill="url(#gradHighlightV)" />
      
  </g>
  
  <!-- Centered Wordmark A U R A -->
  <text x="600" y="870" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="124" 
        font-weight="700" 
        letter-spacing="28" 
        fill="#F8FAFC">AURA</text>

  <!-- Centered Descriptor -->
  <text x="600" y="950" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="600" 
        letter-spacing="16" 
        fill="#94A3B8">AMBIENT INTELLIGENCE</text>
</svg>